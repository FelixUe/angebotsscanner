# Angebotsscanner – Beispielkonfiguration
#
# Kopieren nach config.yaml (gitignored) und anpassen. Hier stehen nur
# fachliche Werte, keine Zugangsdaten – die kommen aus der .env.

standort:
  # Postleitzahl für regionale Prospekte (EDEKA, Penny …).
  plz: "10115"

einkauf:
  # An diesem Tag wird eingekauft. Ein Angebot zählt nur, wenn es an
  # diesem Tag gilt.
  wochentag: freitag
  # Für Vorratszutaten wird so weit vorausgeschaut (Frischware nur Woche 0).
  vorlauf_wochen: 2

# Welche Märkte zählen. `namen` sind die Bezeichnungen, unter denen die
# Quelle den Markt führt.
maerkte:
  - name: EDEKA
    quelle: marktguru
    namen: [EDEKA, EDEKA Frischemarkt]
  - name: Penny
    quelle: marktguru
    namen: [PENNY]
  - name: Aldi Nord
    quelle: aldi_nord

quellen:
  marktguru:
    # Inoffizielle Schnittstelle der Webseite marktguru.de: Die Schlüssel
    # liest der Adapter wie der Browser von der Startseite. Nur für den
    # privaten Gebrauch, auf eigenes Risiko – deshalb standardmäßig aus.
    # Im Container einschalten mit ANGEBOTSSCANNER_QUELLEN=marktguru,aldi_nord.
    aktiv: false
    # Sekunden zwischen zwei Anfragen.
    abstand_s: 2
    max_begriffe: 100
  aldi_nord:
    # Eigene Angebotsseite (aldi-nord.de/angebote.html), bundesweite Preise,
    # ein Abruf je Lauf. robots.txt erlaubt die Seite.
    aktiv: true
    # Aktionsgruppen ohne Lebensmittel überspringen.
    ohne_gruppen: [Spielzeug, Kindermode, Damenmode, Herrenmode, Elektronik, Badezimmer,
                   Weihnachtsdeko, Pflanzen, Küche, Tierbedarf & Haushalt]

mealie:
  # Liste, die der Essensplaner mit `essensplaner mealie-einkauf` füllt.
  # Zugang über MEALIE_URL und MEALIE_TOKEN in der .env.
  liste: Wocheneinkauf
  # Label für Zeilen, die nur der Scanner anlegt (Vorrat, Notvorrat).
  label: Angebote

betrieb:
  # `angebotsscanner dienst` läuft zu diesen Zeiten. Sonntag 19:00 liegt
  # nach dem Essensplaner (18:00) und nach Aldis Umstellung auf die neue
  # Woche; Mittwoch 19:00 sieht die Donnerstags-Aktionen.
  laeufe: ["sonntag 19:00", "mittwoch 19:00"]
  zeitzone: Europe/Berlin
  nachholen_stunden: 12

http:
  user_agent: "angebotsscanner/0.1 (privater Gebrauch; +https://github.com/FelixUe/angebotsscanner)"
  timeout_s: 20
  # So lange werden Antworten zwischengespeichert.
  cache_stunden: 6

# Kundenkarten/Apps, deren Preise gelten sollen (z. B. edeka, penny).
# Angebote, die eine App verlangen, die hier fehlt, fallen weg.
apps: []

bewertung:
  # Ab dieser Ersparnis lohnt sich ein Vorrats- oder Notvorratskauf.
  min_ersparnis_prozent: 20
  # So viele frühere Beobachtungen braucht die Preishistorie, bevor sie
  # den Ausschlag gibt.
  min_datenpunkte: 3
  relevanz:
    geplant: 1.0
    geplant_folgewoche: 0.9
    vorrat_knapp: 0.8
    vorrat: 0.6
    notvorrat: 0.4

# Nie vorschlagen. Geprüft gegen Marke, Produkt und Beschreibung.
ausschluesse:
  - blauschimmel
  - gorgonzola
  - roquefort
  - stilton
  - bavaria blu
  - danablu
  - salbei
  - fenchel

# Regeln je Artikel (Schlüssel = Kurzname des Artikels).
#   suche:    Suchbegriff bei der Quelle, sonst der Artikelname
#   begriffe: zusätzliche Synonyme
#   nicht:    Treffer mit diesen Wörtern in Marke/Produkt sind kein Treffer
regeln:
  kaese:
    # Gemeint ist Schnittkäse am Stück oder in Scheiben.
    nicht: [frischkaese, schmelzkaese, hirtenkaese, kaesekuchen, kaesestange, kaesesahne, kaesesauce, kaesesosse, ofenkaese, huettenkaese, koerniger, reibekaese, gerieben, quark]
  butter:
    nicht: [margarine, rama, streichfett, kaergarden, buttermilch, spekulatius, mit butter, erdnussbutter]
  milch:
    nicht: [buttermilch, reis, kaffee, schokolade, kondensmilch, latte]
  reis:
    nicht: [milch, waffel]
  nudeln:
    begriffe: [pasta, spaghetti, penne, fusilli, teigwaren]
    nicht: [instant, instand, suppe]
  salz:
    nicht: [weniger salz, salakis]
  tee:
    # Teegetränke in Flaschen sind kein Tee zum Aufbrühen.
    nicht: [volvic, eistee, icetea, ice tea]
  quark:
    nicht: [frucht]
  kaffee:
    nicht: [pads, kapseln, loeslich, chilled, latte, tassenportion]
  passata:
    begriffe: [passierte tomaten]
